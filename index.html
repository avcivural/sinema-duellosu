<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinema Düellosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Düzen: telefon öncelikli tek sütun. Koyu sahne zemini; vurgu rengi seçilen kategoriye göre değişir. */
  --bg:#14101c; --bg2:#2a1f3d; --card:#211a2e; --line:#3a3050;
  --ink:#f3eee6; --mute:#a79fb5; --acc:#f2b84b; --ok:#3ecf7a; --bad:#ef5d5d;
  --fd:"Bricolage Grotesque",system-ui,sans-serif; --fb:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%);background-attachment:fixed;
  color:var(--ink);font:400 16px/1.5 var(--fb);transition:background-color .4s}
#app{max-width:480px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:18px;min-height:100%}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;line-height:1.1}
h1{font-size:40px;font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:800}
h3{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
p{max-width:65ch}
.mute{color:var(--mute);font-size:14px}
.eyebrow{color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.row{flex-direction:row}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:#17121f;font-weight:700;padding:14px 18px;border-radius:12px;width:100%;text-align:center}
.btn.sm{width:auto;padding:9px 12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mute)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
/* skor tablosu */
.pl{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;text-align:left}
.pl.lead{border-color:var(--acc)}
.pl .nm{font:800 26px/1 var(--fd);flex:1}
.pl .sc{font:800 30px/1 var(--fd);font-variant-numeric:tabular-nums}
.pl small{display:block;font:600 12px var(--fb);color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
/* kategoriler */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat .d{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600;flex:none}
.cat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 12px;text-align:left;font-weight:700;display:flex;gap:8px;align-items:center}
.cat:disabled{opacity:.35}
.chip{border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-weight:600;width:100%;text-align:left;background:var(--card)}
/* soru */
.tag{color:var(--acc);font-weight:700;font-size:14px}
.q{font-size:26px;min-height:3.3em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;font-weight:600;font-size:17px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.big{font:800 54px/1 var(--fd);font-variant-numeric:tabular-nums}
.skull{font-size:64px;line-height:1}
/* formlar */
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.orow{display:flex;gap:10px;align-items:center}
.orow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
#msg{color:var(--bad);font-size:14px;min-height:1.4em}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok);color:#06210f}.pill.bad{background:var(--bad);color:#fff}
ul.plain{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
ol.rules{padding-left:22px;display:flex;flex-direction:column;gap:10px}
ol.rules.flow li{animation:lit 3s both}
ol.rules.flow li:nth-child(2){animation-delay:3s}ol.rules.flow li:nth-child(3){animation-delay:6s}
ol.rules.flow li:nth-child(4){animation-delay:9s}ol.rules.flow li:nth-child(5){animation-delay:12s}
ol.rules.flow li:nth-child(6){animation-delay:15s}ol.rules.flow li:nth-child(7){animation-delay:18s}ol.rules.flow li:nth-child(8){animation-delay:21s}ol.rules.flow li:nth-child(9){animation-delay:24s}
@keyframes lit{0%,100%{color:var(--ink)}15%,85%{color:var(--acc)}}
.note{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.warn{font-size:13px;color:var(--mute);text-align:center;border-top:1px solid var(--line);padding-top:12px;line-height:1.4}
.birce{position:fixed;top:14px;right:14px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:none}
.birce img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.birce.used{opacity:.35;filter:grayscale(1)}
.dlg{position:fixed;inset:0;background:rgba(10,6,18,.85);z-index:15;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg .card{width:100%;max-width:380px;align-items:center;text-align:center;gap:12px}
.dlg img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--acc)}
.foot{margin-top:auto;display:flex;justify-content:center;gap:20px;align-items:center}
.baba{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.baba img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.pl{position:relative;overflow:visible;padding-left:120px;min-height:96px;margin-top:22px}
.pl.ghost{background:transparent;border:2px dashed var(--line);opacity:.75;min-height:84px}
.pl.ghost .nm{font-size:20px;color:var(--mute)}
.pl.ghost small{color:var(--mute);text-transform:none;letter-spacing:0}
.pl .qm{position:absolute;left:30px;top:50%;transform:translateY(-50%);width:60px;height:60px;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;font:800 28px var(--fd);color:var(--mute)}
.pl img{position:absolute;left:8px;bottom:-1px;width:104px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.season{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mute)}
.season b{color:var(--acc);font-variant-numeric:tabular-nums;font-family:var(--fd);font-size:16px}
.season.over b{color:var(--bad)}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:64px;height:64px;flex:none}
#splash{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;animation:fade .5s 2.4s forwards}
#splash svg{width:200px;height:200px}
#splash .top{transform-origin:12px 34px;animation:clap 1.6s .3s ease-in-out}
@keyframes clap{0%{transform:rotate(-28deg)}55%{transform:rotate(-28deg)}75%{transform:rotate(0)}85%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes fade{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
/* efektler */
#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:9}
.fly{position:fixed;bottom:-40px;font-size:34px;z-index:9;pointer-events:none;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translateY(-105vh) rotate(25deg);opacity:0}}
.boo{position:fixed;left:50%;top:38%;font-size:130px;z-index:9;pointer-events:none;animation:boo 1.6s ease-out forwards}
@keyframes boo{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.plane{position:fixed;top:16%;left:0;width:56px;color:var(--ink);z-index:9;pointer-events:none;animation:plane 1.8s ease-in-out forwards}
@keyframes plane{0%{transform:translate(-80px,60px) rotate(8deg)}50%{transform:translate(45vw,-10px) rotate(-10deg)}100%{transform:translate(110vw,30px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.fly,.boo,.plane,.shake,ol.rules.flow li{animation:none;display:none}ol.rules.flow li{display:list-item}}
</style>
</head>

let Q=[]; try{ Q=JSON.parse(localStorage.getItem('bekleyen_'+ROOT))||[]; }catch(e){}
function qSave(){ try{ localStorage.setItem('bekleyen_'+ROOT, JSON.stringify(Q)); }catch(e){} }
function qPush(path,val){ Q=Q.filter(x=>x[0]!==path); Q.push([path,val]); qSave(); }
let flushing=null, offWarn=0;
function flush(){ if(flushing) return flushing; flushing=(async()=>{
    while(Q.length){ const [path,val]=Q[0];
      try{ const r=await fetch(`${DB_URL}/${ROOT}/${path}.json`,{method:'PUT',body:JSON.stringify(val)}); if(!r.ok) throw 0; }
      catch(e){ if(Date.now()-offWarn>30000){ offWarn=Date.now(); toast('Bağlantı yok. Kayıtların telefonda bekliyor, bağlantı gelince gönderilecek.'); } break; }
      if(Q[0]&&Q[0][0]===path&&Q[0][1]===val) Q.shift(); qSave(); }
  })().finally(()=>{ flushing=null; }); return flushing; }
window.addEventListener('online',()=>flush());

let AC;
function tone(notes,wave,dur){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); let t = AC.currentTime;
    notes.forEach(f=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=wave; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur); t+=dur*.9; });
  }catch(e){}
}
const calm = () => window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function confetti(){
  if (calm()) return; const cv=$('#fx'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const col=['#f2b84b','#3ecf7a','#ff7eb6','#35c2d6','#f3eee6'];
  const ps=Array.from({length:90},()=>({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*7+4,c:col[Math.floor(Math.random()*5)],r:Math.random()*6}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();});
    if(t-t0<1500) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height); })(t0);
}

function boo(e){ if (calm()) return; const s=document.createElement('span'); s.className='boo'; s.textContent=e; document.body.appendChild(s); setTimeout(()=>s.remove(),1700); app.classList.add('shake'); setTimeout(()=>app.classList.remove('shake'),500); }

function subView(k){
  const c=CATS[k]; theme(k); if(Object.keys(c.subs).length===1) return startRound('cat',k,'');
  const subs = Object.keys(c.subs).filter(s=>QS.filter(q=>q.cat===k&&q.sub===s).length>=TUR).map(s=>[s,QS.filter(q=>q.cat===k&&q.sub===s).length]);

/* Soru seçimi: önce bu cihazda görülmemiş sorular; wf verilirse ağırlıklı rastgele */
function seen(){ let l=[]; try{ l=JSON.parse(localStorage.getItem('seen_'+me))||[]; }catch(e){} const d=(S.seen&&S.seen[me])||[]; return [...new Set(d.concat(l))]; }
function markSeen(ids){ const a=seen().filter(x=>!ids.includes(x)).concat(ids).slice(-5000); S.seen[me]=a; try{ localStorage.setItem('seen_'+me, JSON.stringify(a)); }catch(e){} store.set('seen/'+me, a); }
function pick(pool,n,wf){
  const list=seen(), pos=new Map(list.map((x,i)=>[x,i]));
  const fresh=pool.filter(q=>!pos.has(q.id)), w=q=>Math.pow(Math.random(),1/(wf?wf(q):1));
  let out=fresh.map(q=>({q,k:w(q)})).sort((a,b)=>b.k-a.k).slice(0,n).map(x=>x.q);
  if(out.length<n){ /* bu dalda görülmemiş soru kalmadı: en uzun zamandır çıkmayanlar */
    out=out.concat(pool.filter(q=>pos.has(q.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id)).slice(0,Math.max(n*4,20)).map(q=>({q,k:w(q)})).sort((a,b)=>b.k-a.k).slice(0,n-out.length).map(x=>x.q)); }
  return out;
}
function strong(id){ const st=S.players[id].stats; return Object.keys(st).filter(c=>st[c].t>=3).sort((a,b)=>st[b].c/st[b].t-st[a].c/st[a].t).slice(0,2); }
function startRound(kind,cat,sub){
  const p=P(); let pool, wf;
  if (kind==='cat'){ pool=QS.filter(q=>q.cat===cat&&(!sub||q.sub===sub)); p.mustMix=true; p.lastCat=cat; save(); }
  else { const st=strong(other(me)); pool=QS.filter(q=>q.cat!==p.lastCat); wf=q=>(st.includes(q.cat)?3:1)*(q.d==='zor'?1.6:q.d==='kolay'?0.7:1); }
  R={kind,cat,qs:pick(pool,TUR,wf),i:0,ok:0}; markSeen(R.qs.map(q=>q.id)); showQ();
}
function showQ(){
  const q=R.qs[R.i], c=CATS[q.cat]; theme(q.cat); R.opts=shuffle(q.o); R.busy=false;
  view(`${birceBadge()}<header class="bar"><button class="lnk" data-act="menu">Çık</button><span>${R.kind==='mix'?'Karışık tur':c.n} · ${R.i+1}/${R.qs.length}</span><b>${P().score} puan</b></header>
  <p class="tag">${c.e} ${c.n}${c.subs[q.sub]?' · '+c.subs[q.sub]:''} · ${({kolay:'kolay',orta:'orta',zor:'zor'})[q.d]} (${P_D[q.d]} puan)</p><h2 class="q">${esc(q.q)}</h2>
  <div class="opts">${R.opts.map((o,i)=>`<button class="opt" data-act="ans" data-arg="${i}">${esc(o)}</button>`).join('')}</div>`);
}
function endRound(){
  const p=P(); if(R.kind==='mix'){ p.mustMix=false; save(); } logEv(`${NAMES[me]} ${R.kind==='mix'?'karışık tur':CATS[R.cat].n+' turu'}: ${R.ok}/${R.qs.length}, +${R.pts||0} puan (toplam ${p.score})`); theme(R.kind==='mix'?null:R.cat);
  view(`<div class="center" style="margin-top:40px"><p class="eyebrow">${R.kind==='mix'?'Karışık tur bitti':CATS[R.cat].n+' turu bitti'}</p>

}

  <section><h3>Puan hesabı</h3><ul><li>Doğru cevap zorluğa göre: kolay ${P_D.kolay}, orta ${P_D.orta}, zor ${P_D.zor} puan. Tur ${TUR} sorudur.</li><li>Birce Bonusu: her oyuncunun sezonda bir kez kullanabileceği hak; bir yanlış cevabı olmamış sayar (normal turda yeni soru gelir, Kafa Tutma'da ceza yazılmaz ve kimse puan almaz).</li><li>Kafa Tutma: bilen ${P_KAFA} puan alır, gönderen ${P_KAFA_CEZA} puan kaybeder (puan sıfırın altına inmez). Bilemeyen 2 saat oynayamaz.</li><li>Baba Sorusu: bilen ${P_BABA} puan alır, bilemeyene ceza yok.</li></ul></section>
  <section><h3>Karışık tur</h3><p>Her kategori turundan sonra zorunludur. Az önce oynanan kategori dışındaki sorulardan seçilir. Rakibin en başarılı iki kategorisi (en az 3 soru cevaplanmış, doğru oranı en yüksek) 3 kat ağırlıkla gelir; zor sorular 1,6 kat, kolaylar 0,7 kat ağırlık taşır.</p></section>
  <section><h3>Soru havuzu</h3><p>Şu an ${QS.length} soru, ${Object.keys(CATS).length-1} kategori. Üç kaynaktan derlendi: (1) Vural Avcı'nın topladığı 37 belgelik Türkçe soru seti (yaklaşık 2.200 soru: evrenler, Oscar, Yeşilçam, kült yönetmenler, diziler); cevap anahtarları şık metinleriyle çapraz kontrol edildi, tekrarlar ayıklandı. (2) Herkese açık Wikipedia film künyesinden (oyuncu, yıl, yönetmen) kurallı üretilen yaklaşık 1.500 soru; her cevap kaynak veriyle doğrulandı. (3) Evrenler ve türler için elle yazılan yaklaşık 450 soru; bağımsız ikinci okumadan geçti. "Genel Sinema" soruları yalnızca karışık turda çıkar. Zorluk etiketi soru metnine göre otomatik verildi. Oyun, daha önce bu cihazda sorulmamış soruları öne alır; sorular.json dosyasına eklenen sorular havuza katılır.</p></section>
  <section><h3>Sezon süresi</h3><p>Her sezonun bir bitiş tarihi vardır (varsayılan 30 gün, baba modundan değiştirilir). Süre dolunca oyun kapanır, yeni sezonu yalnızca baba başlatır.</p></section>
  <section><h3>Veriler nerede</h3><p>${DB_URL?'Skorlar, cezalar ve Kafa Tutma soruları ortak depoda tutulur; iki telefon aynı durumu görür.':'Deneme modu: her şey bu cihazın tarayıcısında tutulur. Ortak depo bağlanınca iki telefon aynı durumu görür.'} Şifreler yalnızca kardeşlerin birbirinin yerine girmesini önlemek içindir.</p></section>
  <section><h3>Ses ve efektler</h3><p>Her kategorinin tek bir doğru ve tek bir yanlış efekti vardır; soruya göre değişmez. Kategori sesleri tarayıcıda üretilir, dosya indirilmez. Açılıştaki kural okuması, sayfanın yanına konan kurallar.mp3 kaydından çalınır.</p></section>`);
}

/* ============ EYLEMLER ============ */
const ACT = {
  home: async()=>{ await sync(); home(); },
  about: aboutView, menu: ()=>menu(), route: ()=>route(), baba: async()=>{ await sync(); babaView(); },
  pin: id=>pinView(id),
  pinOk(id){
    const v=$('#pin').value.trim(); if(!/^\d{4}$/.test(v)) return msg('Şifre 4 rakam olmalı.');
    const isB=id==='baba', cur=isB?S.babaPin:S.players[id].pin;
    if(!cur){ if(isB){S.babaPin=v;store.set('babaPin',v);} else {S.players[id].pin=v;store.set('players/'+id+'/pin',v);} }
    else if(cur!==v) return msg('Şifre yanlış.');
    if(isB) babaView(); else { me=id; logEv(NAMES[id]+' oyuna girdi'); route(); }
  },
  listen(){
    $('#rules').classList.add('flow');
    try{ AUD = AUD || new Audio('kurallar.mp3'); AUD.currentTime=0; AUD.play().catch(()=>msg('Ses kaydı henüz eklenmemiş. Kurallar aşağıda yazılı.')); }catch(e){ msg('Ses kaydı henüz eklenmemiş. Kurallar aşağıda yazılı.'); }
  },
  introOk(){ try{ AUD&&AUD.pause(); }catch(e){} P().intro=true; save(); tone([392,523,659,784,1047],'triangle',.13); confetti();
    view(`<div class="center" style="margin-top:100px">${LOGO}<p class="eyebrow">Hoş geldin ${NAMES[me]}</p><h1>${S.meta.season}. sezon başlıyor</h1><p class="mute">${seasonBar()}</p></div>`); setTimeout(route,2300); },
  cat: k=>subView(k),
  start(a){ const [k,s]=a.split('|'); startRound('cat',k,s); },
  mix: ()=>startRound('mix'),
  ans(i,btn){
    if(R.busy) return; R.busy=true; const q=R.qs[R.i], c=CATS[q.cat], good=R.opts[+i]===q.a, p=P();
    document.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(R.opts[j]===q.a) b.classList.add('ok'); });
    const st=p.stats[q.cat]=p.stats[q.cat]||{c:0,t:0}; st.t++;
    if(good){ st.c++; p.score+=P_D[q.d]; R.ok++; R.pts=(R.pts||0)+P_D[q.d]; tone(c.ok,'triangle',.11); confetti(); burst(c.e); }
    else { btn.classList.add('bad'); tone(c.no,c.w,c.d); boo(c.bad); }
    save();
    if(!good && p.birce){ setTimeout(()=>birceAsk('soru'),1200); return; }
    setTimeout(()=>{ R.i++; R.i<R.qs.length?showQ():endRound(); }, good?1500:2000);
  },
  chAns(i,btn){
    if(C.done) return; C.done=true; i=+i; const good=i===C.a, p=P(), baba=C.kind==='baba', ch=S.ch[C.id];
    document.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===C.a) b.classList.add('ok'); });
    ch.g=i;
    logEv(baba?`${NAMES[me]} Baba Sorusu'nu ${good?'bildi (+'+P_BABA+')':'bilemedi'}`:`${NAMES[me]} ${NAMES[C.from]}'${C.from==='ilgin'?'ın':'in'} kafa tutmasını ${good?'bildi (+'+P_KAFA+', '+NAMES[C.from]+' -'+P_KAFA_CEZA+')':'bilemedi'}`);
    if(good){ ch.st='won'; p.score+=baba?P_BABA:P_KAFA;
      if(!baba){ const o=S.players[C.from]; o.score=Math.max(0,o.score-P_KAFA_CEZA); store.set('players/'+C.from+'/score',o.score); }
      tone([523,659,784,1047],'triangle',.12); confetti(); }
    else { ch.st='lost'; btn.classList.add('bad'); if(!baba){ p.lockUntil=Date.now()+CEZA_MS; p.lockCh=C.id; if(!p.birce) logEv(NAMES[me]+' 2 saat ceza aldı'); } tone([196,185,175,165],'sawtooth',.3); boo('☠️'); }
    store.set('ch/'+C.id,ch); save();
    if(!good && !baba && p.birce){ setTimeout(()=>birceAsk('kafa'),1200); return; }
    setTimeout(route,2200);
  },
  birceYes(kind){
    const p=P(); p.birce=false; document.getElementById('bdlg')?.remove(); logEv(`${NAMES[me]} Birce Bonusu'nu kullandı (${kind==='kafa'?'ceza silindi':'yanlış silindi'})`); tone([784,988,1175,1568],'sine',.12); confetti(); burst('🩷');
    if(kind==='soru'){ const q=R.qs[R.i], st=p.stats[q.cat]; st.t=Math.max(0,st.t-1); const pool=QS.filter(x=>x.cat===q.cat&&!R.qs.includes(x)); if(pool.length) R.qs[R.i]=pool[Math.floor(Math.random()*pool.length)]; save(); setTimeout(showQ,1400); }
    else { const ch=S.ch[C.id]; ch.st='birce'; p.lockUntil=0; p.lockCh=''; store.set('ch/'+C.id,ch); save(); setTimeout(route,1400); }
  },
  birceNo(kind){ document.getElementById('bdlg')?.remove(); if(kind==='kafa') logEv(NAMES[me]+' 2 saat ceza aldı'); if(kind==='soru'){ R.i++; R.i<R.qs.length?showQ():endRound(); } else route(); },
  appeal(){ const id=P().lockCh; S.ch[id].st='appealed'; store.set('ch/'+id,S.ch[id]); logEv(NAMES[me]+' cezaya itiraz etti'); lockView(); },
  compose(k){ composeBaba = k==='baba'; composeView(); },
  send(){
    const q=$('#cq').value.trim(), o=[0,1,2,3].map(i=>$('#o'+i).value.trim()), r=document.querySelector('input[name=cor]:checked');
    if(!q) return msg('Soruyu yaz.'); if(o.some(x=>!x)) return msg('Dört şıkkı da doldur.'); if(!r) return msg('Doğru şıkkı işaretle.');
    const base={q,o,a:+r.value,st:'pending',ts:Date.now()}, id='c'+Date.now();
    logEv(composeBaba?'Baba Sorusu gönderildi':`${NAMES[me]} ${NAMES[other(me)]}'${other(me)==='ilgin'?'a':'e'} kafa tuttu`);
    if(composeBaba) IDS.forEach(pid=>{ S.ch[id+pid]=Object.assign({from:'baba',to:pid,kind:'baba'},base); store.set('ch/'+id+pid,S.ch[id+pid]); });
    else { S.ch[id]=Object.assign({from:me,to:other(me),kind:'kafa'},base); store.set('ch/'+id,S.ch[id]); P().planeDay=today(); save(); }
    view(`<div class="plane">${PLANE}</div><div class="center" style="margin-top:120px"><h2>Uçak yola çıktı</h2><p class="mute">${composeBaba?'Ilgın ve Ecem':NAMES[other(me)]} oyunu açınca ilk bunu görecek.</p></div>`);
    tone([523,659,784],'sine',.12); setTimeout(composeBaba?babaView:menu,2000);
  },
  apYes(id){ const c=S.ch[id]; c.st='pardoned'; logEv('Baba itirazı kabul etti, '+NAMES[c.to]+' affedildi'); S.players[c.to].lockUntil=0; store.set('ch/'+id,c); store.set('players/'+c.to+'/lockUntil',0); babaView(); },
  apNo(id){ S.ch[id].st='rejected'; logEv('Baba itirazı reddetti ('+NAMES[S.ch[id].to]+')'); store.set('ch/'+id,S.ch[id]); babaView(); },
  pardon(id){ logEv('Baba '+NAMES[id]+'\'i affetti'); S.players[id].lockUntil=0; store.set('players/'+id+'/lockUntil',0); babaView(); },
  seasonSet(){ const d=parseInt($('#sd').value,10); if(!(d>0&&d<400)) return toast('1 ile 399 arasında gün gir.'); S.meta.seasonEnd=Date.now()+d*864e5; store.set('meta',S.meta); toast('Sezon '+d+' gün sonra bitecek.'); babaView(); },
  pinReset(id){ S.players[id].pin=''; store.set('players/'+id+'/pin',''); toast(NAMES[id]+' bir sonraki girişte yeni şifre belirleyecek.'); },
  resetAsk(){ $('#rs').innerHTML='<p>Emin misin? Bu sezonun puanları sıfırlanacak.</p><div class="row"><button class="btn sm danger" data-act="resetGo">Evet, sezonu bitir</button><button class="btn sm ghost" data-act="baba">Vazgeç</button></div>'; },
  wipeAsk(){ $('#wipe').innerHTML='<p>Emin misin? Geri alınamaz.</p><div class="row"><button class="btn sm danger" data-act="wipeGo">Evet, her şeyi sil</button><button class="btn sm ghost" data-act="baba">Vazgeç</button></div>'; },
  async wipeGo(){ if(DB_URL) await fetch(`${DB_URL}/${ROOT}.json`,{method:'DELETE'}).catch(()=>{}); try{ Object.keys(localStorage).forEach(k=>{ if(k===ROOT||k.startsWith('seen_')) localStorage.removeItem(k); }); }catch(e){} location.reload(); },
  resetGo(){
    const a=S.players.ilgin.score, b=S.players.ecem.score;
    S.meta.champs.push({s:S.meta.season,w:a>b?'ilgin':b>a?'ecem':'',a,b,d:new Date().toLocaleDateString('tr-TR')}); S.meta.season++; S.meta.seasonEnd=Date.now()+30*864e5;
    for(const id of IDS){ Object.assign(S.players[id],{score:0,stats:{},mustMix:false,lastCat:'',lockUntil:0,lockCh:'',planeDay:'',birce:true}); store.set('players/'+id,S.players[id]); }
    S.ch={}; store.set('ch',null); store.set('meta',S.meta); S.log=[]; logEv(`${S.meta.season}. sezon başladı`); babaView();
  }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(f) f(b.dataset.arg,b); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pin') ACT.pinOk(document.querySelector('[data-act=pinOk]').dataset.arg); });
/* Eski sürüm telefonda yerel oynandıysa, o kayıt bir kez ortak veritabanına aktarılır */
async function migrate(){
  if(!DB_URL) return; let L; try{ if(localStorage.getItem('migrated_'+ROOT)) return; L=JSON.parse(localStorage.getItem(ROOT)); }catch(e){ return; }
  const ls={}; for(const id of IDS){ try{ ls[id]=JSON.parse(localStorage.getItem('seen_'+id))||[]; }catch(e){ ls[id]=[]; } }
  if(!L && !IDS.some(id=>ls[id].length)){ try{ localStorage.setItem('migrated_'+ROOT,'1'); }catch(e){} return; }
  L=norm(L||{}); const act=p=>Object.values(p.stats||{}).reduce((a,x)=>a+(x.t||0),0)+(p.score||0);
  const w=[];
  for(const id of IDS){ const a=S.players[id], b=L.players[id];
    if(act(b)>act(a)){ S.players[id]=Object.assign({},b,{pin:a.pin||b.pin}); w.push(['players/'+id,S.players[id]]); }
    else if(!a.pin&&b.pin){ a.pin=b.pin; w.push(['players/'+id,a]); }
    if(ls[id].length){ S.seen[id]=[...new Set(S.seen[id].concat(ls[id]))].slice(-5000); w.push(['seen/'+id,S.seen[id]]); } }
  for(const k in L.ch) if(!S.ch[k]){ S.ch[k]=L.ch[k]; w.push(['ch/'+k,L.ch[k]]); }
  if(!S.babaPin&&L.babaPin){ S.babaPin=L.babaPin; w.push(['babaPin',L.babaPin]); }
  if(L.meta.season===S.meta.season && L.meta.seasonEnd<S.meta.seasonEnd){ S.meta.seasonEnd=L.meta.seasonEnd; }
  if((L.meta.champs||[]).length>S.meta.champs.length) S.meta.champs=L.meta.champs;
  w.push(['meta',S.meta]);
  const seenL=new Set(S.log.map(x=>x.t+x.m)); S.log=S.log.concat(L.log.filter(x=>!seenL.has(x.t+x.m))).sort((a,b)=>a.t-b.t).slice(-60); w.push(['log',S.log]);
  try{ await Promise.all(w.map(([p,v])=>fetch(`${DB_URL}/${ROOT}/${p}.json`,{method:'PUT',body:JSON.stringify(v)}).then(r=>{ if(!r.ok) throw 0; }))); localStorage.setItem('migrated_'+ROOT,'1'); logEv('Bir telefonun eski kaydı ortak tabloya aktarıldı'); }catch(e){}
}
/* Açılış: veritabanına bağlanmadan oyun açılmaz (puanlar telefonda sıkışmasın diye) */
function offView(t){ app.innerHTML=`<div class="center" style="margin-top:80px">${LOGO}<h2>${t}</h2><p class="mute">Puanların kaybolmasın diye oyun yalnızca ortak tabloya bağlıyken açılır.</p><button class="btn" data-act="boot">Tekrar dene</button></div>`; }
async function boot(){
  if(!DB_URL) return offView('Oyun ortak tabloya bağlı değil. Babana haber ver.');
  if(!(await sync())) return offView('İnternet bağlantısı yok');
  await migrate(); home();
}
ACT.boot=boot; window.addEventListener('online',()=>{ if($('[data-act=boot]')) boot(); });
/* Güncelleme görevlisi: her açılışta sayfanın en yenisini sunucudan ister */
if('serviceWorker' in navigator && DB_URL) navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
